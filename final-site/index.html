<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Nostalgia Gallery</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <div class="desktop">
    <div class="window" id="welcomeWindow">
      <div class="title-bar">My Old PC</div>
      <div class="content">
        <p>Welcome to your memories.</p>
      </div>
    </div>

    <div class="window hidden" id="chatWindow">
      <div class="title-bar">Message Logs</div>
      <div class="content">
        <p>*ding* Hey, remember this?</p>
        <p>2008-07-22: "brb getting food"</p>
        <p>2008-07-22: "no u hang up first lol"</p>
      </div>
    </div>

    <div class="window hidden" id="folderWindow">
      <div class="title-bar">My Files</div>
      <div class="content">
        <p>📁 Screenshots_2009</p>
        <p>📁 Music_Mix_MP3</p>
        <p>📁 Homework - Grade 8</p>
      </div>
    </div>

    <!-- Proceed Button -->
    <button id="next-0" class="proceed-button">Next</button>
  </div>

  <!-- <audio id="startupSound" src="assets/startup.mp3" autoplay></audio> -->
</body>
</html>
